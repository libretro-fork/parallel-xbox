name: Shader and PSO regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.revisions.outputs.matrix }}
      software: ${{ steps.revisions.outputs.software }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: revisions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          ACCEPTED: ${{ vars.SHADER_ACCEPTED_BASELINE }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          after, before = os.environ['AFTER'], os.environ.get('BEFORE', '')
          if os.environ['EVENT'] == 'push' and before and set(before) != {'0'}:
              commits = git('rev-list', '--reverse', before+'..'+after).splitlines()
          else:
              commits = [after]
          if not commits or len(commits) > 32:
              raise SystemExit('Unqualified: split pushes larger than 32 commits; no commits are silently skipped')
          accepted = os.environ.get('ACCEPTED', '')
          if accepted and not re.fullmatch(r'[0-9a-fA-F]{40}', accepted):
              raise SystemExit('SHADER_ACCEPTED_BASELINE must pin a verified full commit SHA')
          if accepted:
              git('cat-file', '-e', accepted+'^{commit}')
          rows = []
          for commit in commits:
              parent = git('rev-parse', commit+'^')
              rows.append(dict(commit=commit, reference=parent, kind='parent'))
              if accepted and accepted != parent:
                  rows.append(dict(commit=commit, reference=accepted, kind='accepted'))
          software = [dict(**row, suite=suite) for row in rows for suite in ['utilities', 'vertex']+['fragment-'+str(i) for i in range(8)]]
          if len(software) > 256:
              raise SystemExit('Unqualified: software matrix exceeds 256 jobs; split this push')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix='+json.dumps(dict(include=rows))+'\n')
              f.write('software='+json.dumps(dict(include=software))+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Every new commit in this push is compared, not just its tip.\n\n')
              f.write('Pinned accepted reference: '+(accepted or '**UNQUALIFIED: not configured; parent comparison only**')+'\n\n')
              f.write('Current cold-play smoothness remains **BAD/regressed** until separate physical-GPU qualification proves recovery.\n')
          PY

  contracts:
    name: Contracts ${{ matrix.commit }} / ${{ matrix.kind }}
    needs: revisions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.revisions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          fetch-depth: 0
          filter: blob:none
      - name: Check candidate source with the current test harness
        env:
          COMMIT: ${{ matrix.commit }}
        run: git -C driver worktree add --detach ../candidate "$COMMIT"
      - name: Install blend-oracle header dependency
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install libgl-dev libegl-dev libgl1-mesa-dri zlib1g-dev g++ spirv-tools gcc-aarch64-linux-gnu qemu-user libubsan1-arm64-cross
      - name: PSO identity, stable jobs, output ownership and file-cache publication
        shell: bash
        run: |
          set -euo pipefail
          export SPV_FAMILY_REQUIRE_IN_PROCESS=1
          mkdir -p results
          for test in test-pipeline-key-clear test-pipeline-job-view test-pipeline-ahead-key test-pipeline-completion-service test-seed-lifetime test-pipeline-register-key test-surface-blend test-vk-recording-epoch test-inline-upload-writer test-inline-index-bounds test-vk-vertex-formats test-frame-completion test-block-memory test-gl-dynamic-pair test-glslgen-queue test-worker-drain test-vk-worker-modules test-shader-cache-handoff test-gl-disk-writer test-gl-module-export test-gl-stage-lifetime test-gl-program-namespace test-file-retained-view test-pipeline-cache-export test-shader-layout test-spv-prefix-view test-gpl-lookup-cache test-pipeline-layout-lends test-ready-pipeline-sibling test-ready-shader-binding test-render-pass-pump test-pending-key-lend test-shader-control-dirty test-spv-vsh test-spv-psh test-spv-display test-spv-utility test-s3tc-preparation test-s3tc-stream test-vk-ring-pressure test-vsh-constant-lend test-vsh-integer-lend test-vsh-layout-names test-seed-convolution test-seed-inplace test-seed-dictionary test-psh-uniform-map; do
            python3 "driver/libretro/tests/$test.py" candidate cc 2>&1 | tee "results/$test.log"
          done
          python3 driver/libretro/tests/test-vfs-read-at.py candidate cc 2>&1 | tee results/vfs-read-at.log
          python3 driver/libretro/tests/test-gl-texture-touch.py candidate cc 2>&1 | tee results/texture-touch-gl.log
          python3 driver/libretro/tests/test-gl-cache-file.py candidate cc 2>&1 | tee results/gl-cache-file.log
          python3 driver/libretro/tests/test-macos-deps.py candidate 2>&1 | tee results/macos-deps.log
          SPV_UTILITY_RUNNER="qemu-aarch64 -L /usr/aarch64-linux-gnu" python3 driver/libretro/tests/test-spv-utility.py candidate aarch64-linux-gnu-gcc 2>&1 | tee results/static-utility-arm64.log
          VSH_CONSTANT_RUNNER="qemu-aarch64 -L /usr/aarch64-linux-gnu" python3 driver/libretro/tests/test-vsh-constant-lend.py candidate aarch64-linux-gnu-gcc 2>&1 | tee results/constant-lend-arm64.log
          VSH_CONSTANT_RUNNER="qemu-aarch64 -L /usr/aarch64-linux-gnu" python3 driver/libretro/tests/test-vsh-integer-lend.py candidate aarch64-linux-gnu-gcc 2>&1 | tee results/integer-lend-arm64.log
          VSH_CONSTANT_RUNNER="qemu-aarch64 -L /usr/aarch64-linux-gnu" python3 driver/libretro/tests/test-vsh-layout-names.py candidate aarch64-linux-gnu-gcc 2>&1 | tee results/layout-names-arm64.log
          SEED_CONVOLUTION_RUNNER="qemu-aarch64 -L /usr/aarch64-linux-gnu" python3 driver/libretro/tests/test-seed-convolution.py candidate aarch64-linux-gnu-gcc 2>&1 | tee results/seed-convolution-arm64.log
          PSH_UNIFORM_RUNNER="qemu-aarch64 -L /usr/aarch64-linux-gnu" python3 driver/libretro/tests/test-psh-uniform-map.py candidate aarch64-linux-gnu-gcc 2>&1 | tee results/psh-uniform-map-arm64.log
          python3 driver/libretro/tests/test-pre-module-keys.py candidate cc --geometry-clear-baseline --check-only 2>&1 | tee results/module-keys.log
          python3 driver/libretro/tests/test-gl-prewarm-traversal.py candidate cc 2>&1 | tee results/gl-prewarm-traversal.log
          python3 driver/libretro/tests/test-prewarm-library-worker.py candidate cc 2>&1 | tee results/prewarm-library-worker.log
          python3 driver/libretro/tests/test-worker-input-view.py candidate cc 2>&1 | tee results/worker-input-view.log
          python3 driver/libretro/tests/test-pre-module-worker.py candidate cc 2>&1 | tee results/pre-module-worker.log
          python3 driver/libretro/tests/test-library-module-identity.py candidate cc 2>&1 | tee results/library-module-identity.log
          python3 driver/libretro/tests/test-sibling-queue.py candidate cc 2>&1 | tee results/sibling-queue.log
          python3 driver/libretro/tests/test-gl-spec-preparation.py candidate cc 2>&1 | tee results/gl-spec-preparation.log
          python3 driver/libretro/tests/test-gl-resident-submit.py candidate cc 2>&1 | tee results/gl-resident-submit.log
          python3 driver/libretro/tests/test-gl-binding-pump.py candidate cc 2>&1 | tee results/gl-binding-pump.log
          python3 driver/libretro/tests/test-gl-ready-cover.py candidate cc 2>&1 | tee results/gl-ready-cover.log
          python3 driver/libretro/tests/test-gl-cover-projection.py candidate cc 2>&1 | tee results/gl-cover-projection.log
          python3 driver/libretro/tests/test-pipeline-completed-take.py candidate cc 2>&1 | tee results/pipeline-completed-take.log
          python3 driver/libretro/tests/test-dirty-page-fast.py candidate cc 2>&1 | tee results/dirty-page-fast.log
          python3 driver/libretro/tests/test-vk-clear-no-pipeline.py candidate cc 2>&1 | tee results/vk-clear-no-pipeline.log
          python3 driver/libretro/tests/test-pipeline-seed-full.py candidate cc 2>&1 | tee results/pipeline-seed-full.log
          python3 driver/libretro/tests/test-dirty-range-owner.py candidate cc 2>&1 | tee results/dirty-range-owner.log
          python3 driver/libretro/tests/test-pvideo-dirty.py candidate cc 2>&1 | tee results/pvideo-dirty.log
          SHADER_OWNER_SANITIZE=1 python3 driver/libretro/tests/test-vsh-source-owners.py candidate cc 2>&1 | tee results/vsh-source-owners.log
          python3 driver/libretro/tests/test-shader-gpu-shards.py candidate 2>&1 | tee results/gpu-shards.log
          python3 driver/libretro/tests/test-shader-gpu-batch.py 2>&1 | tee results/gpu-batch.log
          python3 driver/libretro/tests/test-vsh-worker-partition.py candidate cc 2>&1 | tee results/vsh-worker-partition.log
          python3 driver/libretro/tests/test-throughput-gate.py 2>&1 | tee results/throughput-gate.log
          python3 driver/libretro/tests/test-shader-compile-gate.py 2>&1 | tee results/compiler-gate.log
          python3 driver/libretro/tests/test-cold-play-frame-gate.py candidate 2>&1 | tee results/cold-play-frame-gate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shader-contracts-${{ matrix.commit }}-${{ matrix.kind }}
          path: results/

  compilation:
    name: Compilation ${{ matrix.commit }} / ${{ matrix.kind }}
    needs: revisions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.revisions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          fetch-depth: 0
          filter: blob:none
      - name: Create separate parent/accepted and candidate source trees
        env:
          COMMIT: ${{ matrix.commit }}
          REFERENCE: ${{ matrix.reference }}
        run: |
          git -C driver worktree add --detach ../candidate "$COMMIT"
          git -C driver worktree add --detach ../reference "$REFERENCE"
          mkdir -p corpus/candidate corpus/reference results
          printf '%s\n' "$COMMIT" "$REFERENCE" > results/revisions.txt
      - name: Build tools and compile the complete bundled dictionary
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install build-essential pkg-config libepoxy-dev spirv-tools
          set -o pipefail
          # Historical seedshaders targets omitted this link prerequisite.
          # Build it first without modifying the reference source or racing goals.
          make -C reference -j2 ./deps/libslirp.a 2>&1 | tee results/reference-dependencies.log
          make -C candidate -j2 ./deps/libslirp.a 2>&1 | tee results/candidate-dependencies.log
          make -C reference -j2 seedshaders 2>&1 | tee results/reference-build.log
          make -C candidate -j2 seedshaders 2>&1 | tee results/candidate-build.log
          reference/libretro/tests/seedshaders reference/data/shader_seeds.bin corpus/reference 2>&1 | tee results/reference-dictionary.log
          candidate/libretro/tests/seedshaders candidate/data/shader_seeds.bin corpus/candidate 2>&1 | tee results/candidate-dictionary.log
      - name: Validate all exported SPIR-V modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = sorted(Path('corpus').rglob('*.spv'))
          if not files:
              raise SystemExit('No generated modules: unqualified')
          for path in files:
              subprocess.run(['spirv-val', '--target-env', 'vulkan1.3', str(path)], check=True)
          Path('results/validation.txt').write_text(f'{len(files)} exported modules validated\n')
          PY
      - name: Compare fresh compiler invocations under SPIR-V 1.5 and 1.6
        id: compiler-comparison
        run: |
          set -o pipefail
          cpu=$(python3 -c 'import os; print(max(os.sched_getaffinity(0)))')
          lscpu > results/cpu.txt
          python3 driver/libretro/tests/benchmark-shader-compile.py --baseline reference --candidate candidate --corpus corpus --output results/comparison --prepare-corpus --validator spirv-val --cpu "$cpu" 2>&1 | tee results/comparison.log
      - name: Require the timing gate to reject an injected slow compiler
        # A real comparison failure must remain red, but must not hide a broken
        # rejection control. Skip only when comparison never ran or was canceled.
        if: ${{ !cancelled() && (steps.compiler-comparison.outcome == 'success' || steps.compiler-comparison.outcome == 'failure') }}
        run: |
          set +e
          cpu=$(python3 -c 'import os; print(max(os.sched_getaffinity(0)))')
          python3 driver/libretro/tests/benchmark-shader-compile.py --baseline candidate --candidate candidate --corpus corpus --output results/negative-control --inject-candidate-delay --cpu "$cpu" > results/negative-control.log 2>&1
          result=$?
          set -e
          cat results/negative-control.log
          python3 - "$result" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path('results/negative-control/report.json').read_text())
          assert int(sys.argv[1]) in (1, 2), 'bad compiler passed'
          assert report['injected_negative_control'] and report['slowdown'] > .20
          assert report['status'] != 'pass'
          # A noisy deliberately delayed process may be inconclusive. That is
          # still a rejected gate, not permission to relax real timing limits.
          PY
      - name: Record the qualification boundary
        if: always()
        run: |
          echo 'This job measures CPU compilation and validates generated words. It does not measure driver PSOs, cold-boot gameplay, physical GPU time or presentation smoothness.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No missing reference-hardware run is converted into a pass. Current cold-play regression remains open.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shader-compilation-${{ matrix.commit }}-${{ matrix.kind }}
          path: |
            results/**/*.log
            results/**/*.json
            results/**/*.csv
            results/**/*.tsv
            results/*.txt

  software-gpu:
    name: Software GPU ${{ matrix.suite }} (${{ matrix.commit }})
    needs: revisions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.revisions.outputs.software) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          fetch-depth: 0
          filter: blob:none
      - env:
          COMMIT: ${{ matrix.commit }}
        run: git -C driver worktree add --detach ../candidate "$COMMIT"
      - name: Install test-only software Vulkan and validation tools
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install build-essential libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers spirv-tools libegl-dev libgl-dev libegl-mesa0 libgl1-mesa-dri
      - name: Create actual utility pipelines and execute numerical controls
        if: matrix.suite == 'utilities'
        run: |
          set -euo pipefail
          mkdir -p results
          python3 driver/libretro/tests/test-gl-texture-shadow.py candidate cc 2>&1 | tee results/gl-texture-shadow.log
          python3 driver/libretro/tests/test-gl-volume-compression.py candidate cc 2>&1 | tee results/gl-volume-compression.log
          python3 driver/libretro/tests/test-glslc-local-init.py candidate --cc cc 2>&1 | tee results/local-init.log
          python3 driver/libretro/tests/test-vsh-mul-select.py candidate --cc cc --validator spirv-val 2>&1 | tee results/vsh-mul-select.log
          python3 driver/libretro/tests/test-spv-clear.py candidate cc --gpu 2>&1 | tee results/clear.log
          python3 driver/libretro/tests/test-vulkan-depth-clear.py candidate cc 2>&1 | tee results/attachment-clear.log
          python3 driver/libretro/tests/test-spv-geom.py candidate cc --gpu 2>&1 | tee results/geometry.log
          python3 driver/libretro/tests/test-display-gamma.py candidate --cc cc --gpu --output results/display 2>&1 | tee results/display.log
          python3 driver/libretro/tests/test-vulkan-s3tc-decode.py candidate cc 2>&1 | tee results/static-s3tc.log
          VK_S3TC_SPIRV_16=1 python3 driver/libretro/tests/test-vulkan-s3tc-decode.py candidate cc 2>&1 | tee results/static-s3tc-16.log
      - name: Execute the complete vertex corpus
        if: matrix.suite == 'vertex'
        run: |
          set -euo pipefail
          mkdir -p results
          python3 driver/libretro/tests/test-spv-vsh-gpu.py candidate cc 2>&1 | tee results/direct-vertex.log
      - name: Execute unchanged fragment batches with an independent driver owner
        if: startsWith(matrix.suite, 'fragment-')
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p results
          shard="${SUITE#fragment-}/8"
          python3 driver/libretro/tests/test-spv-psh-gpu.py candidate cc --shard "$shard" --workers 4 --list-batches | tee results/fragment-manifest.json
          python3 driver/libretro/tests/test-spv-psh-gpu.py candidate cc --shard "$shard" --workers 4 2>&1 | tee results/direct-fragment.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shader-software-gpu-${{ matrix.commit }}-${{ matrix.kind }}-${{ matrix.suite }}
          path: results/

  shader-gate:
    name: Shader and PSO required gate
    if: always()
    needs: [revisions, contracts, compilation, software-gpu]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every revision and reference job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, value in results.items() if value['result'] != 'success']
          if failed:
              raise SystemExit('Failed or unqualified shader checks: '+', '.join(failed))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('CPU compilation, PSO contracts and software-GPU checks passed for every tested revision.\n\n')
              f.write('This is NOT physical-GPU cold-play qualification. The current cold-play regression remains open.\n')
          PY

  physical-cold-play:
    name: Reference-hardware cold-play qualification
    # Never run private assets or a self-hosted runner on untrusted PR code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/libretro' && vars.SHADER_HARDWARE_ENABLED == 'true'
    needs: revisions
    runs-on: [self-hosted, shader-reference]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Run the administrator-provisioned cold/warm fixture service
        env:
          REVISIONS: ${{ needs.revisions.outputs.matrix }}
          ACCEPTED: ${{ vars.SHADER_ACCEPTED_BASELINE }}
          QUALIFIER: ${{ vars.SHADER_HARDWARE_QUALIFIER }}
          CPU_AFFINITY: ${{ vars.SHADER_CPU_AFFINITY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACCEPTED" && test -n "$QUALIFIER" && test -n "$CPU_AFFINITY"
          # Executable is provisioned on the trusted runner, not downloaded by the core.
          # Contract and cache/scene requirements are in docs/cold-first-play-recovery.md.
          "$QUALIFIER" --revisions-json "$REVISIONS" --accepted "$ACCEPTED" --cpu-affinity-json "$CPU_AFFINITY" --output "$RUNNER_TEMP/shader-cold-play-$GITHUB_RUN_ID"
      - name: Audit raw callback evidence independently of the fixture exit code
        if: always()
        env:
          REVISIONS: ${{ needs.revisions.outputs.matrix }}
          ACCEPTED: ${{ vars.SHADER_ACCEPTED_BASELINE }}
          CPU_AFFINITY: ${{ vars.SHADER_CPU_AFFINITY_JSON }}
        shell: bash
        run: |
          python3 libretro/tests/gate-cold-play-frames.py \
            --report "$RUNNER_TEMP/shader-cold-play-$GITHUB_RUN_ID/public-report" \
            --revisions-json "$REVISIONS" --accepted "$ACCEPTED" --cpu-affinity-json "$CPU_AFFINITY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shader-reference-hardware-${{ github.sha }}
          path: ${{ runner.temp }}/shader-cold-play-${{ github.run_id }}/public-report/**
