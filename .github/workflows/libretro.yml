name: Build libretro core

# The core with the static Makefile: xemu_libretro.so for Linux x86_64 and
# aarch64, xemu_libretro.dll for Windows (cross-compiled with MinGW-w64,
# tested under Wine). Android and macOS with meson (-Dlibretro=true) until
# the Makefile builds them.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, comma-separated (linux, windows, android, macos), or all'
        type: string
        default: all
  push:
    branches: [libretro]

# Test builds can be limited to the platforms their testers use: the
# platforms input (workflow_dispatch) lists them. Pushes and "all" build
# everything.
jobs:
  # The static Makefile with MinGW-w64, as in MSYS2's MINGW64 shell: every
  # library the core links is built from source (Makefile.deps), and the
  # DLL needs only Windows' own DLLs. The tests run it under Wine.
  windows-x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    name: Windows x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      # The POSIX thread model, as MSYS2's gcc has; Wine and Mesa for the
      # tests, nasm for the test ROMs
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -qy update
          sudo apt-get -qy install make gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix nasm wine64 xvfb \
            libgl1-mesa-dri
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Build
        run: make -j$(nproc) platform=win CROSS_PREFIX=x86_64-w64-mingw32-

      # The core's run loop against the test ROMs, in a Windows build of the
      # harness under Wine, on Mesa's software OpenGL
      - name: Frame and audio tests
        run: |
          export WINEDEBUG=-all WINEPREFIX=$PWD/.wine
          xvfb-run -a sh -c 'wineboot -u && libretro/tests/run.sh xemu_libretro.dll'

      - name: Collect
        run: |
          mkdir -p dist
          cp xemu_libretro.dll dist/
          cp ui/xemu_libretro.info dist/
          x86_64-w64-mingw32-objdump -p dist/xemu_libretro.dll | grep 'DLL Name'
          x86_64-w64-mingw32-strip --strip-unneeded dist/xemu_libretro.dll
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-windows-x86_64
          path: dist/

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04${{ matrix.arch == 'aarch64' && '-arm' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      # The libraries the core links (the Makefile finds them through
      # pkg-config; glslang/SPIRV-Tools as the static libraries), Vulkan's
      # headers, and what the tests need: nasm for the test ROMs, Mesa's
      # software OpenGL on a surfaceless EGL display
      - name: Install dependencies
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install pkg-config libglib2.0-dev libslirp-dev \
            libepoxy-dev zlib1g-dev libsamplerate0-dev libvulkan-dev \
            glslang-dev spirv-tools patchelf \
            nasm libegl-dev libgl-dev libegl-mesa0 libgl1-mesa-dri

      # The static Makefile; -g for the symbols artifact (dist/ is stripped)
      - name: Build
        run: make -j$(nproc) CFLAGS=-g CXXFLAGS=-g

      # The core's run loop against the test ROMs, on Mesa's software
      # OpenGL: a frame's worth of audio and a frame each retro_run, the
      # tone unbroken, fast-forward, savestates (libretro/tests/run.sh)
      - name: Frame and audio tests
        run: libretro/tests/run.sh xemu_libretro.so

      # libslirp is not in every frontend's runtime (Flatpak
      # RetroArch's, for one), so it goes next to the core, found through
      # $ORIGIN.
      - name: Collect
        run: |
          mkdir -p dist
          cp xemu_libretro.so dist/
          cp ui/xemu_libretro.info dist/
          # the unstripped core too, for profiling and crash backtraces
          mkdir -p symbols
          cp xemu_libretro.so symbols/
          patchelf --set-rpath '$ORIGIN' symbols/xemu_libretro.so
          strip --strip-unneeded dist/xemu_libretro.so
          patchelf --set-rpath '$ORIGIN' dist/xemu_libretro.so
          for lib in libslirp.so.0; do
            cp -L "/usr/lib/${{ matrix.arch }}-linux-gnu/$lib" dist/
          done
          ls -la dist
          readelf -d dist/xemu_libretro.so | grep -E 'NEEDED|RUNPATH'

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-linux-${{ matrix.arch }}
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-linux-${{ matrix.arch }}-symbols
          path: symbols/

  # After X-OG Mobile's recipe (Ashnar2602/X-OG_Mobile): glib, pixman and
  # libsamplerate from vcpkg's Android triplets, the NDK's clang, and QEMU's
  # configure with what Android has no use for left out. The renderer is
  # Vulkan, through the frontend's context.
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: arm64-android
            cpu: aarch64
            clang: aarch64-linux-android29
          - abi: x86_64
            triplet: x64-android
            cpu: x86_64
            clang: x86_64-linux-android29
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install ninja-build python3-pip python3-tomli python3-yaml python3-venv \
            glslang-dev glslang-tools spirv-tools pkg-config
          echo "NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-${{ matrix.triplet }}-v1

      - name: vcpkg
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet=${{ matrix.triplet }} \
            glib pixman libsamplerate libepoxy
          echo "PREFIX=$VCPKG_INSTALLATION_ROOT/installed/${{ matrix.triplet }}" >> $GITHUB_ENV

      - name: Configure
        run: |
          T=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          export AR=$T/llvm-ar RANLIB=$T/llvm-ranlib NM=$T/llvm-nm STRIP=$T/llvm-strip
          ./configure \
            --cross-prefix= \
            --cc=$T/${{ matrix.clang }}-clang --cxx=$T/${{ matrix.clang }}-clang++ \
            --host-cc=cc --cpu=${{ matrix.cpu }} \
            --target-list=i386-softmmu \
            --disable-werror --disable-rust --disable-docs --disable-tools --disable-guest-agent \
            --disable-gtk --disable-sdl --disable-sdl-image --disable-vnc --disable-spice --disable-curses \
            --disable-virglrenderer --disable-libusb --disable-usb-redir --disable-curl \
            --disable-gnutls --disable-nettle --disable-gcrypt --disable-bzip2 --disable-zstd --disable-lzo \
            --disable-libnfs --disable-libiscsi --disable-linux-aio --disable-linux-io-uring \
            --disable-slirp --disable-pa --disable-pipewire --disable-alsa --disable-jack --disable-oss \
            --disable-sndio --audio-drv-list= \
            --extra-cflags="-DXBOX=1 -Wno-error" \
            --extra-ldflags="-L$PREFIX/lib" \
            -Dlibretro=true -Db_staticpic=true

      # Every error of the run, which a tail of the output cuts off
      - name: Build
        run: |
          ninja -k 0 -C build xemu_libretro.so > ninja.log 2>&1 && exit 0
          grep -E -B2 -A8 "error:|FAILED:" ninja.log | head -600
          exit 1

      - name: Collect
        run: |
          mkdir -p dist
          cp build/xemu_libretro.so dist/xemu_libretro_android.so
          cp ui/xemu_libretro.info dist/
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded dist/xemu_libretro_android.so
          ls -la dist
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d dist/xemu_libretro_android.so | grep NEEDED

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-android-${{ matrix.abi }}
          path: dist/

  # As upstream's macOS build (build.sh): the libraries from MacPorts through
  # scripts/download-macos-libs.py, Apple clang with the SDK and the minimum
  # versions upstream targets
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          brew install ninja coreutils vulkan-headers
          pip install pyyaml requests tomli
          python3 ./scripts/download-macos-libs.py ${{ matrix.arch }}

      - name: Configure
        run: |
          arch=${{ matrix.arch }}
          if [ "$arch" = arm64 ]; then min=13.7.4; else min=12.7.5; fi
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          lib=$PWD/macos-libs/$arch/opt/local
          export CFLAGS="-arch $arch -target $arch-apple-macos$min -isysroot $sdk -I$lib/include -mmacosx-version-min=$min"
          export LDFLAGS="-arch $arch -isysroot $sdk"
          export PKG_CONFIG_LIBDIR="$lib/lib/pkgconfig"
          ./configure \
            --extra-cflags="-DXBOX=1 -Wno-error $CFLAGS" \
            --extra-ldflags="-headerpad_max_install_names" \
            --target-list=i386-softmmu --disable-cocoa --cross-prefix= \
            -Dlibretro=true -Db_staticpic=true

      - name: Build
        run: |
          ninja -k 0 -C build xemu_libretro.dylib > ninja.log 2>&1 && exit 0
          grep -E -B2 -A8 "error:|FAILED:" ninja.log | head -600
          exit 1

      - name: Collect
        run: |
          mkdir -p dist
          cp build/xemu_libretro.dylib dist/xemu_libretro.dylib
          cp ui/xemu_libretro.info dist/
          strip -x dist/xemu_libretro.dylib
          # The MacPorts libraries (glib, pixman, epoxy, ...) go along in a
          # folder of their own next to the core, as upstream bundles them
          # into its app. Their install names are under /opt/local/lib, where
          # nothing is on the runner: they are taken from macos-libs and
          # pointed at that folder, and so are their own dependencies.
          src=$PWD/macos-libs/${{ matrix.arch }}/opt/local/lib
          libs=dist/xemu_libretro_libs
          mkdir -p $libs
          todo=dist/xemu_libretro.dylib
          while [ -n "$todo" ]; do
            next=""
            for f in $todo; do
              for dep in $(otool -L "$f" | awk 'NR>1 && $1 ~ /^\/opt\/local\// {print $1}'); do
                name=$(basename "$dep")
                if [ ! -f "$libs/$name" ]; then
                  cp -L "$src/$name" "$libs/$name"
                  chmod u+w "$libs/$name"
                  install_name_tool -id "@loader_path/$name" "$libs/$name"
                  next="$next $libs/$name"
                fi
                if [ "$f" = dist/xemu_libretro.dylib ]; then
                  install_name_tool -change "$dep" "@loader_path/xemu_libretro_libs/$name" "$f"
                else
                  install_name_tool -change "$dep" "@loader_path/$name" "$f"
                fi
              done
            done
            todo=$next
          done
          ls $libs
          codesign -f -s - $libs/*.dylib dist/xemu_libretro.dylib
          otool -L dist/xemu_libretro.dylib
          lipo -info dist/xemu_libretro.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: xemu_libretro-macos-${{ matrix.arch }}
          path: dist/
