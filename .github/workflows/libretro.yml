name: Build libretro core

# The core with the static Makefile: parallel_xbox_libretro.so for Linux x86_64 and
# aarch64, parallel_xbox_libretro.dll for Windows (cross-compiled with MinGW-w64,
# tested under Wine), parallel_xbox_libretro_android.so for Android (the NDK's
# clang) and parallel_xbox_libretro.dylib for macOS.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, comma-separated (linux, windows, android, macos), or all'
        type: string
        default: all
  push:
    branches: [libretro]

# Test builds can be limited to the platforms their testers use: the
# platforms input (workflow_dispatch) lists them. Pushes and "all" build
# everything.
jobs:
  dsp-guest-ram:
    name: DSP guest RAM ordering regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Carry specialization rejects the DOA3 throughput regression
        run: python3 libretro/tests/test-tb-lookup-state.py . cc
      - name: APU waits for SSL publication and preserves RAM address zero
        env:
          TAIL_TEST_CFLAGS: -fsanitize=address,undefined
          TAIL_PENDING_NEGATIVE: 1
        run: python3 libretro/tests/test-voice-tail.py . cc pending
      - name: MMX MOVD preserves values with one full-width store
        run: python3 libretro/tests/test-mmx-movd.py . cc
      - name: MMX entry preserves x87 publication and state transitions
        run: python3 libretro/tests/test-mmx-entry.py . cc
      - name: MMX scalar generators match existing helpers
        run: python3 libretro/tests/test-mmx-scalar.py . cc
      - name: Code-cache flushes discard stale block chains
        run: python3 libretro/tests/test-tb-flush-chain.py . cc
      - name: Code-page invalidation batches cache clears
        run: |
          python3 libretro/tests/test-tb-page-cache.py . cc
          python3 libretro/tests/test-tb-store-overlap.py . cc
      - name: Incoming carry arithmetic stays inline and correct
        run: python3 libretro/tests/test-byte-carry.py . cc
      - name: Throughput gate rejects large drops and inconclusive measurements
        run: python3 libretro/tests/test-throughput-gate.py
      - name: Texgen viewer changes preserve packed modes and uniform storage
        run: python3 libretro/tests/test-texgen-viewer.py . cc
      - name: Back material uniforms stay live without retaining borrowed data
        run: python3 libretro/tests/test-back-lighting.py . cc
      - name: Savestates restore lighting and point constants before uploads
        run: python3 libretro/tests/test-lighting-point-state.py . cc
      - name: Spotlight coefficients preserve context words and partial writes
        run: python3 libretro/tests/test-spotlight-falloff.py . cc
      - name: Sprite coordinates apply only to rasterized points
        run: python3 libretro/tests/test-point-sprite-selection.py . cc
      - name: Raw specular coefficients preserve partial writes and owned uniforms
        run: python3 libretro/tests/test-specular-updates.py . cc
      - name: EP worker ownership must preserve RAM, queue handoffs and TLB guards
        run: python3 libretro/tests/test-dsp-ownership.py . cc
      - name: EP ownership under address and undefined behavior sanitizers
        env:
          DSP_OWNERSHIP_SANITIZE: 1
        run: python3 libretro/tests/test-dsp-ownership.py . cc
      - name: GP ticks must finish before the guest changes scratch RAM
        run: python3 libretro/tests/test-dsp-guest-ram.py . cc
      - name: Every frontend turn must retain exact audio cadence
        run: python3 libretro/tests/test-frame-audio-pull.py . cc
      - name: Store-free work must not be mistaken for an idle wait
        run: python3 libretro/tests/test-quiet-progress.py . cc
      - name: Directed SSE arithmetic preserves flags, aliases and host state
        run: python3 libretro/tests/test-sse-directed.py . cc
      - name: Native SSE square root preserves rounding, flags and host state
        run: python3 libretro/tests/test-sse-native-sqrt.py . cc
      - name: Ordered SSE comparisons preserve flags and exceptional inputs
        run: python3 libretro/tests/test-sse-ordered-compare.py . cc
      - name: Inline TCG hash lookup preserves atomic readers and retries
        run: python3 libretro/tests/test-qht-inline.py . cc
      - name: Inline hash lookup with address and undefined behavior sanitizers
        env:
          QHT_SANITIZE: 1
        run: python3 libretro/tests/test-qht-inline.py . cc
      - name: Secondary jump cache survives primary collisions
        run: python3 libretro/tests/test-secondary-cache.py . cc
      - name: Generated TB lookup preserves cache identity and slow-path guards
        run: python3 libretro/tests/test-generated-tb-lookup.py . cc
      - name: Generated TB lookup with address and undefined behavior sanitizers
        env:
          TB_MMU_CFLAGS: -fsanitize=address -fno-omit-frame-pointer
        run: python3 libretro/tests/test-generated-tb-lookup.py . cc
      - name: Frame owner retains CPU device ownership across faults and interrupts
        run: python3 libretro/tests/test-owner-cpu-boundary.py . cc
      - name: CPU owner boundary under address and undefined behavior sanitizers
        env:
          OWNER_CPU_CFLAGS: -fsanitize=address -fno-omit-frame-pointer
        run: python3 libretro/tests/test-owner-cpu-boundary.py . cc
      - name: Watchpoint restart preserves existing BQL ownership
        run: python3 libretro/tests/test-watchpoint-owner.py . cc
      - name: Watchpoint ownership with address and undefined behavior sanitizers
        env:
          WATCHPOINT_OWNER_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
        run: python3 libretro/tests/test-watchpoint-owner.py . cc
      - name: ACI shared stream interrupts and S/PDIF reset
        run: python3 libretro/tests/test-aci-irq.py . cc
      - name: ACI interrupts under address and undefined behavior sanitizers
        env:
          ACI_IRQ_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
        run: python3 libretro/tests/test-aci-irq.py . cc
      - name: ACI independent PCM and S/PDIF descriptor progress
        run: python3 libretro/tests/test-aci-playback.py . cc
      - name: ACI playback under address and undefined behavior sanitizers
        env:
          ACI_PLAYBACK_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
        run: python3 libretro/tests/test-aci-playback.py . cc
      - name: Bounded DSP DMA zero-discard aperture and normal transfer isolation
        run: python3 libretro/tests/test-dsp-dma-zero.py . cc
      - name: DSP DMA aperture under address and undefined behavior sanitizers
        env:
          DSP_DMA_ZERO_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
        run: python3 libretro/tests/test-dsp-dma-zero.py . cc
      - name: SPSC pair publication with fortified libc and sanitizers
        env:
          SPSC_PAIR_CFLAGS: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fsanitize=address -fno-omit-frame-pointer
        run: python3 libretro/tests/test-spsc-pair.py . cc
      - name: Core has one fixed guest target without a selection macro
        run: python3 libretro/tests/test-single-target.py .
      - name: Fixed x86 execution binding preserves complete legacy boundary state
        run: python3 libretro/tests/test-fixed-x86-entry.py . cc
      - name: Fixed x86 binding under address and undefined behavior sanitizers
        env:
          X86_ENTRY_CFLAGS: -fsanitize=address -fno-omit-frame-pointer
        run: python3 libretro/tests/test-fixed-x86-entry.py . cc
      - name: Fixed x86 block-exit PC synchronization
        run: python3 libretro/tests/test-fixed-tb-sync.py . cc
      - name: Fixed x86 block-exit synchronization under sanitizers
        env:
          TB_SYNC_CFLAGS: -fsanitize=address -fno-omit-frame-pointer
        run: python3 libretro/tests/test-fixed-tb-sync.py . cc
      - name: Only dominating stores may remove quiet-budget checks
        run: python3 libretro/tests/test-quiet-store-prefix.py . cc
      - name: Install native DSP test build dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libepoxy-dev
      - name: Native DSP instructions must match the interpreter without fallback
        timeout-minutes: 10
        run: make dspdecode dspnative dspnativeprograms dspdma dspbootstrap dspdmaspans dspinvalidate dspcoverage dspflush dspinit dspmax dspjumps dsptcc dsplogical dspstatus dspbudget dsprelative dsploops dspprogram dspregisterloops dspcompare dspstartup

  dsp-cache-flush:
    name: DSP cache flush sanitizers and ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install focused DSP toolchains
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libepoxy-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: ARM64 fresh and recycled CPU jump execution
        run: python3 libretro/tests/test-arm64-fresh-jumps.py . aarch64-linux-gnu-gcc
      - name: Cache publication and flush under ASan and UBSan
        run: make CC="cc -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" DSPINIT="$RUNNER_TEMP/dspinit-sanitize" DSPFLUSH="$RUNNER_TEMP/dspflush-sanitize" DSPCOVERAGE="$RUNNER_TEMP/dspcoverage-sanitize" DSPBOOTSTRAP="$RUNNER_TEMP/dspbootstrap-sanitize" DSPDMASPANS="$RUNNER_TEMP/dspdmaspans-sanitize" dspflush dspcoverage dspbootstrap dspdmaspans dspinit
      - name: Cache publication and flush on emulated ARM64
        run: make CC=aarch64-linux-gnu-gcc DSPINIT="$RUNNER_TEMP/dspinit-arm64" DSPFLUSH="$RUNNER_TEMP/dspflush-arm64" DSP_PROGRAM_RUNNER="qemu-aarch64 -L /usr/aarch64-linux-gnu" DSPCOVERAGE="$RUNNER_TEMP/dspcoverage-arm64" DSPBOOTSTRAP="$RUNNER_TEMP/dspbootstrap-arm64" DSPDMASPANS="$RUNNER_TEMP/dspdmaspans-arm64" dspflush dspcoverage dspbootstrap dspdmaspans dspinit

  guest-gpu-progress:
    name: DOAX guest GPU progress regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Production MMIO handlers and wake accounting; no game, BIOS or GPU.
      - name: Guest flip releases must prevent premature idle time skips
        run: python3 libretro/tests/test-nv2a-guest-wakes.py . cc
      - name: NGB RAM-counter waits must yield without skipping useful computation
        run: python3 libretro/tests/test-memory-poll.py . cc
      - name: TCG owners, temp headroom and allocator boundaries
        run: python3 libretro/tests/test-tcg-global-layout.py . cc
      - name: TCG reachability and liveness match the pre-port passes
        env:
          TCG_LIVENESS_NEGATIVE: 1
          TCG_LIVENESS_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: python3 libretro/tests/test-tcg-liveness.py . cc
      - name: TCG optimizer copy and generation handling match the pre-port passes
        env:
          TCG_COPY_NEGATIVE: 1
          TCG_COPY_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: python3 libretro/tests/test-tcg-optimizer-copy.py . cc
      - name: Native register budgets must preserve helper accounting and request halves
        run: python3 libretro/tests/test-tcg-budget-register.py . cc
      - name: Execute x86 TLB memo guards, rewalks and helper ABI fault controls
        env:
          TCG_TLB_MEMO_NEGATIVE: 1
          TCG_TLB_MEMO_CFLAGS: -DCONFIG_DEBUG_TCG
        run: python3 libretro/tests/test-tcg-tlb-memo.py . cc
      - name: TLB memo compiler and planner under ASan and UBSan
        env:
          # Whole-TU fixture: do not retain unrelated core globals as ASan roots.
          TCG_TLB_MEMO_CFLAGS: -DCONFIG_DEBUG_TCG -fsanitize=address,undefined --param=asan-globals=0
        run: python3 libretro/tests/test-tcg-tlb-memo.py . cc
      - name: Early wait nominations must preserve prepaid instructions and interrupt requests
        run: python3 libretro/tests/test-early-memory-wait.py . cc
      - name: Idle candidates must preserve proof entries without crossing code pages
        run: python3 libretro/tests/test-idle-candidate-prefix.py . cc
      - name: Deliver interrupts before proving kernel or RAM waits
        run: python3 libretro/tests/test-idle-interrupts.py . cc
      - name: GPU and halted waits must leave guest time to the frame owner
        run: python3 libretro/tests/test-gpu-wait-deadline.py . cc
      - name: Fixed instruction clock initialization, accounting and restored state
        run: python3 libretro/tests/test-icount-publication.py . cc
      - name: Depth readback must pack directly into mapped output safely
        run: python3 libretro/tests/test-depth-host-pack.py . cc
      - name: Packed depth swizzle routing and reuse barriers
        run: python3 libretro/tests/test-packed-swizzle.py . cc
      - name: Fused depth shader addressing and resource ownership
        run: python3 libretro/tests/test-fused-depth.py . cc
      - name: Readback buffer growth must refresh fixed descriptors after settlement
        run: python3 libretro/tests/test-vk-buffer-growth.py . cc
      - name: Linear texture staging must skip padding and preserve direct reads
        run: python3 libretro/tests/test-linear-texture-staging.py . cc
      - name: Retired overlay allocations must reuse exact matches within budget
        run: python3 libretro/tests/test-pvideo-image-pool.py . cc
      - name: Overlay resize must retire uploads and display reads without waiting
        run: python3 libretro/tests/test-pvideo-retirement.py . cc
      - name: Video uploads must track independent guest RAM dirtiness
        run: python3 libretro/tests/test-pvideo-dirty.py . cc
      - name: Packed video conversion must preserve pixels and row bounds
        run: python3 libretro/tests/test-yuv422.py . cc

  # The static Makefile with MinGW-w64, as in MSYS2's MINGW64 shell: every
  # library the core links is built from source (Makefile.deps), and the
  # DLL needs only Windows' own DLLs. The tests run it under Wine.
  windows-x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    name: Windows x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      # The POSIX thread model, as MSYS2's gcc has; Wine and Mesa for the
      # tests, nasm for the test ROMs. run.sh also compiles native Linux
      # test fixtures, which need the host graphics development packages.
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -qy update
          sudo apt-get -qy install make gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix nasm wine64 xvfb \
            pkg-config libepoxy-dev libegl-dev libgl-dev \
            libvulkan-dev vulkan-validationlayers spirv-tools \
            libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers qemu-utils strace
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Build
        run: make -j$(nproc) platform=win CROSS_PREFIX=x86_64-w64-mingw32-

      # The core's run loop against the test ROMs, in a Windows build of the
      # harness under Wine, on Mesa's software OpenGL
      - name: Execute Windows TLB memo guards and seven-argument helper ABI
        env:
          TCG_TLB_MEMO_BINARY: ${{ runner.temp }}/tlb-memo.exe
          TCG_TLB_MEMO_SKIP_RUN: 1
          TCG_TLB_MEMO_CFLAGS: -DCONFIG_DEBUG_TCG
        run: |
          python3 libretro/tests/test-tcg-tlb-memo.py . x86_64-w64-mingw32-gcc
          export WINEDEBUG=-all WINEPREFIX=$PWD/.wine
          xvfb-run -a sh -c 'wineboot -u && wine "$TCG_TLB_MEMO_BINARY"'

      - name: Frame and audio tests
        run: |
          export WINEDEBUG=-all WINEPREFIX=$PWD/.wine
          xvfb-run -a sh -c 'wineboot -u && libretro/tests/run.sh parallel_xbox_libretro.dll'

      - name: Collect
        run: |
          mkdir -p dist
          cp parallel_xbox_libretro.dll dist/
          cp ui/parallel_xbox_libretro.info dist/
          x86_64-w64-mingw32-objdump -p dist/parallel_xbox_libretro.dll | grep 'DLL Name'
          x86_64-w64-mingw32-strip --strip-unneeded dist/parallel_xbox_libretro.dll
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox_libretro-windows-x86_64
          path: dist/

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04${{ matrix.arch == 'aarch64' && '-arm' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      # The library the core links (libepoxy, found through pkg-config;
      # Vulkan's headers are in deps/) and what the tests need: the Vulkan
      # loader, nasm for the test ROMs, Mesa's
      # software OpenGL on a surfaceless EGL display and its software
      # Vulkan (lavapipe)
      - name: Install dependencies
        run: |
          sudo apt-get -qy update
          sudo apt-get -qy install pkg-config \
            libepoxy-dev libvulkan-dev vulkan-validationlayers spirv-tools patchelf \
            nasm libegl-dev libgl-dev libegl-mesa0 libgl1-mesa-dri \
            mesa-vulkan-drivers strace qemu-utils
          if [ "$(uname -m)" = aarch64 ]; then
            sudo apt-get -qy install gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu
          fi

      # The static Makefile; -g for the symbols artifact (dist/ is stripped)
      - name: Build
        run: make -j$(nproc) CFLAGS=-g CXXFLAGS=-g

      # The core's run loop against the test ROMs, on Mesa's software
      # OpenGL and Vulkan: a frame's worth of audio and a frame each
      # retro_run, the tone unbroken, fast-forward, savestates
      # (libretro/tests/run.sh)
      - name: Frame and audio tests
        run: libretro/tests/run.sh parallel_xbox_libretro.so

      - name: Native DSP coverage and interpreter equivalence
        timeout-minutes: 10
        run: make dspdecode dspnative dspnativeprograms dspdma dspbootstrap dspdmaspans dspinvalidate dspcoverage dspflush dspinit dspmax dspjumps dsptcc dsplogical dspstatus dspbudget dsprelative dsploops dspprogram dspregisterloops dspcompare dspstartup

      # GLib is the core's own and libslirp is linked in: the core is the
      # one file
      - name: Collect
        run: |
          mkdir -p dist
          cp parallel_xbox_libretro.so dist/
          cp ui/parallel_xbox_libretro.info dist/
          # the unstripped core too, for profiling and crash backtraces
          mkdir -p symbols
          cp parallel_xbox_libretro.so symbols/
          patchelf --set-rpath '$ORIGIN' symbols/parallel_xbox_libretro.so
          strip --strip-unneeded dist/parallel_xbox_libretro.so
          patchelf --set-rpath '$ORIGIN' dist/parallel_xbox_libretro.so
          ls -la dist
          readelf -d dist/parallel_xbox_libretro.so | grep -E 'NEEDED|RUNPATH'

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox_libretro-linux-${{ matrix.arch }}
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox_libretro-linux-${{ matrix.arch }}-symbols
          path: symbols/

  # The Makefile with the NDK's clang (platform=android): Vulkan, through
  # the frontend's context
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Build
        run: make -j$(nproc) platform=android NDK=$ANDROID_NDK_LATEST_HOME ANDROID_ABI=${{ matrix.abi }}

      - name: Collect
        run: |
          mkdir -p dist
          cp parallel_xbox_libretro_android.so dist/
          cp ui/parallel_xbox_libretro.info dist/
          T=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          $T/llvm-strip --strip-unneeded dist/parallel_xbox_libretro_android.so
          ls -la dist
          $T/llvm-readelf -d dist/parallel_xbox_libretro_android.so | grep NEEDED

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox_libretro-android-${{ matrix.abi }}
          path: dist/

  # The macOS core by the Makefile (platform=osx), with the libraries
  # upstream xemu's build takes from MacPorts
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          brew install coreutils pkgconf
          pip install pyyaml requests tomli
          python3 ./scripts/download-macos-libs.py ${{ matrix.arch }}

      - name: Build
        run: |
          export PKG_CONFIG_LIBDIR=$PWD/macos-libs/${{ matrix.arch }}/opt/local/lib/pkgconfig
          make -j$(sysctl -n hw.ncpu) ARCH=${{ matrix.arch }} > make.log 2>&1 && exit 0
          grep -E -B2 -A8 "error:|Error " make.log | head -600
          exit 1

      - name: Collect
        run: |
          mkdir -p dist
          cp parallel_xbox_libretro.dylib dist/parallel_xbox_libretro.dylib
          cp ui/parallel_xbox_libretro.info dist/
          strip -x dist/parallel_xbox_libretro.dylib
          # The MacPorts libraries (libepoxy) go along in a
          # folder of their own next to the core, as upstream bundles them
          # into its app. Their install names are under /opt/local/lib, where
          # nothing is on the runner: they are taken from macos-libs and
          # pointed at that folder, and so are their own dependencies.
          src=$PWD/macos-libs/${{ matrix.arch }}/opt/local/lib
          libs=dist/parallel_xbox_libretro_libs
          mkdir -p $libs
          todo=dist/parallel_xbox_libretro.dylib
          while [ -n "$todo" ]; do
            next=""
            for f in $todo; do
              for dep in $(otool -L "$f" | awk 'NR>1 && $1 ~ /^\/opt\/local\// {print $1}'); do
                name=$(basename "$dep")
                if [ ! -f "$libs/$name" ]; then
                  cp -L "$src/$name" "$libs/$name"
                  chmod u+w "$libs/$name"
                  install_name_tool -id "@loader_path/$name" "$libs/$name"
                  next="$next $libs/$name"
                fi
                if [ "$f" = dist/parallel_xbox_libretro.dylib ]; then
                  install_name_tool -change "$dep" "@loader_path/parallel_xbox_libretro_libs/$name" "$f"
                else
                  install_name_tool -change "$dep" "@loader_path/$name" "$f"
                fi
              done
            done
            todo=$next
          done
          ls $libs
          codesign -f -s - $libs/*.dylib dist/parallel_xbox_libretro.dylib
          otool -L dist/parallel_xbox_libretro.dylib
          lipo -info dist/parallel_xbox_libretro.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox_libretro-macos-${{ matrix.arch }}
          path: dist/
