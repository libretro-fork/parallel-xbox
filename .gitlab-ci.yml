# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)
#
# Linux x64, Linux aarch64 and Windows x64.
#
# Every job builds with the static Makefile. The Windows job cross-compiles
# in the MXE toolchain image upstream xemu builds its Windows releases in,
# every library from source (.ci/libretro-windows.sh). The Linux jobs run in
# Ubuntu 24.04, as the buildbot's Linux images (Ubuntu 16.04) are older than
# the compiler and the libepoxy and Vulkan headers the core needs
# (.ci/libretro-linux.sh). The templates give the jobs their stage, runner
# tags and artifacts; the scripts replace the templates' CMake steps.
#
# Android and macOS are built by the GitHub workflow only: macOS takes
# libepoxy from MacPorts and ships it in a folder next to the core, which
# the buildbot's one-file artifact cannot hold, and the buildbot's Android
# image is not known to have a recent NDK.

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

variables:
  # The submodules are QEMU's firmware sources (edk2, u-boot and the like),
  # none of which the core builds; its dependencies are in deps/.
  GIT_SUBMODULE_STRATEGY: none
  # The whole history, for the version string (git describe)
  GIT_DEPTH: 0

.core-defs:
  variables:
    CORENAME: parallel_xbox

include:
  # Linux
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-cmake.yml'

  # Windows
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-cmake-mingw.yml'

stages:
  - build-prepare
  - build-shared

# A runner having a bad minute should not redden the pipeline; anything really
# broken still fails three times over.
default:
  retry: 2

##############################################################################
#################################### STAGES ##################################
##############################################################################

# Defining before_script replaces the template's instead of adding to it, so
# its NUMPROC is set again here.
.core-defs-linux:
  extends: .core-defs
  image: ubuntu:24.04
  timeout: 2h
  before_script:
    - export NUMPROC=$(($(nproc)/5))
  script:
    - bash .ci/libretro-linux.sh

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-cmake-x86_64
    - .core-defs-linux

# Linux 64-bit (ARM)
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-cmake-aarch64
    - .core-defs-linux

# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .libretro-windows-cmake-x86_64
    - .core-defs
  image: ghcr.io/xemu-project/xemu-win64-toolchain-gcc:sha-18018f1
  timeout: 2h
  before_script:
    - export NUMPROC=$(($(nproc)/5))
  script:
    - bash .ci/libretro-windows.sh
